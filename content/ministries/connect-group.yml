contactKeyword: CONNECT
body:
  - Real-life change happens in the context of relationships — small groups. In the Bible, they worshipped in the temple, but ministry happened from house to house.
  - Small groups provide a place to connect, protect and grow. Prov 27:17.
  - Our small groups meet once a month in places all around our city or online and provide a place for you to connect, grow, and discuss the issues and challenges of life. Regardless of age, interest, or location, a group exists for you. Small groups are also where we pray, care for one another, and are missed if we don't show up!
  - If you want more information, kindly text "CONNECT" to 301-637-0122 or reach out through our contact page. We would love for you to get connected.
