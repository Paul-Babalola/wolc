slug: youth
title: Youth
imageUrl: https://rccgwolc.org/wp-content/uploads/2023/03/JDS-1594.jpg
blurb: As Kingdom Anointed Youths we believe youths are the leaders of tomorrow.
meetingInfo: Sundays during worship
order: 2
body:
  - Youths are very important to the kingdom of God. Examples of great youths that God used as recorded in the Bible are Jeremiah, David, Daniel, and Samuel. As Kingdom Anointed Youths we believe youths are the leaders of tomorrow.
  - We believe as leaders of tomorrow a greater responsibility and a duty have been placed in our hands by Jesus Christ. So our mission is to make disciples on this earth for Christ. We do this through fellowships such as dramatizations, music, dancing, outreach and evangelism.
  - Our vision is to ensure that youths are empowered with the understanding and knowledge that they can make a great impact in this world through making disciples and living for Christ.
