body:
  - Sharing our faith and ministering to others is one of the things we do here at RCCG Word of Life Center. We believe part of our faith is ministering to people and leading them to Christ's Salvation.
  - Our goal is to show people the love of Jesus by meeting the tangible needs of our communities. We are motivated by the words of Jesus found in Matthew 25:35-36, where he identifies himself with the hungry, the thirsty, the stranger, the naked, the sick, and the imprisoned.
  - If you are interested in joining the outreach department, kindly text "OUTREACH" to 301-637-0122, or reach out through our contact page.
