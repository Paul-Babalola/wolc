slug: children
title: Children's Ministry (Covenant Seed)
imageUrl: https://rccgwolc.org/wp-content/uploads/2023/03/JDS-1461-e1678919720579.jpg
blurb: We are on a mission to build a solid foundation of Christ in the lives of our children.
meetingInfo: Sundays during worship
order: 1
body:
  - We are on a mission to build a solid foundation of Christ in the lives of our children. We seek to accomplish this goal through prayerfully guiding the children in the ways of the Lord and teaching them about the love of Christ.
  - We strive to help our children develop a keen interest and love for the Bible, the living word of God; which is done through Sunday school lessons, games and fun interactive activities. These activities are targeted towards building their confidence, social skills and self esteem.
  - We strongly encourage parents to involve their children in our ministry as we work in partnership to lead their children to Christ.
