order: 3
quote: |
  Iron sharpeneth iron,
  So a man/woman sharpeneth the countenance of his/her friend.
quoteRef: Proverbs 27:17
body:
  - The Women of Grace Ministry was birthed after God gave Elizabeth Ojuolape (Lady E) a vision on a verse of the scripture Proverbs 27:17.
  - By the inspiration of the Holy Spirit, the vision of the Women of Grace ministry under the leadership of Lady E, is to create an avenue where women from all walks of life seeking His Grace (and working by faith) can gather to fellowship, have discourse on the Word, rub minds, share ideas, iron out issues challenging today's Christian woman, while lifting each other up in prayer to fulfill God's purpose in all of our lives.
  - To this effect, membership is open to all women irrespective of church denomination or affiliation.
