  - component: about
    eyebrow: Welcome
    heading: A place of comfort, / hope, and / peace of mind
    highlight: for your worship.
    body:
      - You are welcome to The Redeemed Christian Church of God Word of Life Center. We are a Bible-based, Jesus-focused and Spirit-led congregation located in Silver Spring, Maryland. RCCG Word of Life Center is a parish of the Redeemed Christian Church of God in North America.
      - We are dedicated to spreading the teachings of Jesus Christ, and our goal is to inspire you through the holiness of our dwelling and our services. We invite you to become a part of our congregation, and look forward to meeting you!
    imageUrl: /images/site/about-church.jpeg
    cta:
      label: Meet our pastors
      href: /about
