bio: |
  Is an ordained minister of the Redeemed Christian Church of God (RCCG), a dynamic teacher of the Word and Pastor of RCCG Word of Life Center (WOLC) in Silver Spring, Maryland. After yielding to the call of salvation at an early age, he became actively involved in the planting and establishment of churches in Lagos, Nigeria before relocating to the United States of America.

  He is a man that has a heart for the people and a Passion for Souls. He has over 10 years of experience in the ministry, and he strongly believes in the undiluted Word of God that declares "without holiness no man shall see the Lord."

  Pastor Emmanuel has a bachelor's degree in Theology from Washington Bible College; he is a graduate of the School of Deliverance from Christ the Redeemers Ministry and School of Disciples both in RCCG in Nigeria.

  He is married to his God ordained soul mate, Elizabeth Ojuolape and they are blessed with two children.
