name: Pastor Elizabeth Ojuolape
role: Lead Pastor
order: 2
bio: |
  Wife of Pastor Emmanuel Ojuolape, fondly referred to as Lady E. Before relocating to the United States, Lady E was the Minister in charge of The Redeemed Christian Church of God, Oyun Parish in Ilorin, Nigeria (1996–1997).

  She actively assists her husband in the ministry so that his God-given assignment is carried out. She is a dynamic teacher of the Word. Her teachings inspire and challenge women to develop a stronger relationship with God and their families.

  Elizabeth Ojuolape is the President of Women of Grace Ministry, a women's fellowship that meets monthly to rub minds together concerning diverse issues and pray to ensure that every woman fulfills the purpose of God in her life.
